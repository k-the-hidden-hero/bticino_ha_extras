# BTicino intercom view for View Assist.
#
# Add it to the View Assist dashboard (Edit dashboard > three dots > Raw
# configuration editor, under `views:`). The "BTicino Intercom on View Assist"
# blueprint opens it when an entrance rings; see docs/view-assist.md.
#
# The view takes the screen in View Assist's hold mode, so the screen stays on
# the call, and gives it back a few seconds after the call is over. When the
# view is opened and no call shows up, it gives the screen back after the
# timeout (90 seconds unless the URL says otherwise).
#
# URL parameters, all optional:
#   camera        show only this entrance (a BTicino camera entity); without
#                 it every entrance has a tab and the one that rings is shown
#   timeout       seconds to keep the screen when no call shows up
#   restore_mode  the View Assist mode to give back (the blueprint sets it)
#   restore_path  the view to give back in hold mode (the blueprint sets it)
type: panel
title: Intercom
# Keep var_view_path below equal to this path.
path: intercom
cards:
  - type: custom:button-card
    template:
      - variable_template
      - responsive_base
      - body_template
    variables:
      var_view_path: intercom
      var_url_params: |-
        [[[
          let queryString = '';
          const vaEntity = hass.states[variables.var_assistsat_entity];
          const currentPath = vaEntity?.attributes?.current_path;
          if (currentPath && currentPath.includes('?')) {
            queryString = currentPath.split('?')[1];
          }
          if (!queryString && window.location.search) {
            queryString = window.location.search.substring(1);
          }
          return new URLSearchParams(queryString);
        ]]]
      # Without a camera in the URL the card shows every entrance, one tab
      # each, and the one that rings selects itself.
      var_camera: |-
        [[[
          const fromUrl = variables.var_url_params.get('camera');
          return fromUrl && hass.states[fromUrl] ? fromUrl : '';
        ]]]
      var_timeout_seconds: |-
        [[[
          const timeout = parseInt(variables.var_url_params.get('timeout'), 10);
          return Number.isFinite(timeout) && timeout > 0 ? timeout : 90;
        ]]]
      var_setup_intercom_hold_mode: |-
        [[[
          const entityId = variables.var_assistsat_entity;
          const viewPath = variables.var_view_path;
          const cleanup = () => {
            if (window.vaIntercomTimeout) clearTimeout(window.vaIntercomTimeout);
            window.vaIntercomTimeout = null;
            window.vaIntercomPageKey = null;
            window.vaIntercomRestore = null;
          };

          if (variables.var_current_view !== viewPath || !entityId) {
            cleanup();
            return '';
          }

          const pageKey = `${window.location.pathname}${window.location.search}`;
          if (window.vaIntercomPageKey === pageKey) return '';
          window.vaIntercomPageKey = pageKey;
          if (window.vaIntercomTimeout) clearTimeout(window.vaIntercomTimeout);

          const params = variables.var_url_params;
          const timeoutMs = variables.var_timeout_seconds * 1000;
          const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const liveHass = () => document.querySelector('home-assistant')?.hass || hass;
          const recordedHere = (h) =>
            String(h.states[entityId]?.attributes?.current_path || '').split('?')[0].endsWith(`/${viewPath}`);

          // The card says on its own element whether the call rings, is up or
          // is over (data-call). It sits in shadow roots: find it once.
          let card = null;
          const findCard = (root) => {
            const hit = root.querySelector('bticino-100x-card');
            if (hit) return hit;
            for (const el of root.querySelectorAll('*')) {
              const found = el.shadowRoot && findCard(el.shadowRoot);
              if (found) return found;
            }
            return null;
          };
          const callState = () => {
            if (!card?.isConnected) card = findCard(document);
            return card?.dataset.call || 'idle';
          };

          const begin = (h) => {
            const attrs = h.states[entityId]?.attributes || {};
            // The blueprint lifts hold before navigating here and passes what
            // to give back; opened by hand, a mode other than hold is the
            // previous one.
            const restoreMode = params.get('restore_mode') || (attrs.mode && attrs.mode !== 'hold' ? attrs.mode : 'normal');
            const restorePath = params.get('restore_path') || '';
            if (attrs.mode !== 'hold') {
              h.callService('view_assist', 'set_state', { entity_id: entityId, mode: 'hold' });
            }
            window.vaIntercomRestore = async () => {
              const live = liveHass();
              cleanup();
              try {
                // Leaving hold, View Assist goes back to its home screen itself.
                await live.callService('view_assist', 'set_state', { entity_id: entityId, mode: 'normal' });
                if (restoreMode === 'hold') {
                  if (restorePath) {
                    await pause(1500);
                    await live.callService('view_assist', 'navigate', { device: entityId, path: restorePath });
                  }
                  await pause(1500);
                  await live.callService('view_assist', 'set_state', { entity_id: entityId, mode: 'hold' });
                } else if (restoreMode !== 'normal') {
                  await pause(1500);
                  await live.callService('view_assist', 'set_state', { entity_id: entityId, mode: restoreMode });
                }
              } catch (error) {
                console.warn('BTicino intercom view: could not restore the View Assist mode', error);
              }
            };

            // Give the screen back 5 seconds after the call is over, or after
            // the timeout when no call shows up here. 15 minutes at most.
            const opened = Date.now();
            let seenCall = false;
            let quietSince = null;
            const watch = () => {
              if (window.vaIntercomPageKey !== pageKey) return;
              // Left another way (the close button, View Assist): forget this
              // visit, so the next ring takes the screen again.
              if (!window.location.pathname.endsWith(`/${viewPath}`)) {
                cleanup();
                return;
              }
              const now = Date.now();
              if (callState() !== 'idle') {
                seenCall = true;
                quietSince = null;
              } else if (seenCall && quietSince === null) {
                quietSince = now;
              }
              const over = seenCall ? quietSince !== null && now - quietSince >= 5000 : now - opened >= timeoutMs;
              if (over || now - opened >= 15 * 60 * 1000) window.vaIntercomRestore?.();
              else window.vaIntercomTimeout = setTimeout(watch, 1000);
            };
            window.vaIntercomTimeout = setTimeout(watch, 1000);
          };

          // Entering hold pins View Assist's hold_path to the path it has on
          // record, and View Assist then keeps the screen there. After a page
          // load the view can render before that path reaches the browser, and
          // this template may not run again, so wait for it here (up to 5 s).
          let tries = 0;
          const waitForPath = () => {
            if (window.vaIntercomPageKey !== pageKey) return;
            const h = liveHass();
            if (recordedHere(h)) begin(h);
            else if (++tries < 20) setTimeout(waitForPath, 250);
            else cleanup();
          };
          waitForPath();
          return '';
        ]]]
    styles:
      grid:
        - grid-template-areas: |
            "status"
            "intercom"
        - grid-template-columns: 1fr
        - grid-template-rows: min-content 1fr
      card:
        - background: '[[[ return `center / cover no-repeat url(${variables.background})` ]]]'
        - background-size: cover
        - border-radius: 0px
        - font-family: "[[[ return `'${variables.var_assistsat_entity_font_style}', sans-serif`; ]]]"
      custom_fields:
        intercom:
          - height: 100%
          - width: 100%
          - min-height: 0
          - overflow: hidden
        close_button:
          - position: absolute
          - right: 1rem
          - top: 1rem
          - z-index: 2
    custom_fields:
      _hold_mode_init: '[[[ return variables.var_setup_intercom_hold_mode ]]]'
      intercom:
        card:
          type: custom:bticino-100x-card
          layout: kiosk
          camera_entity: '[[[ return variables.var_camera ]]]'
      close_button:
        card:
          type: custom:button-card
          icon: mdi:close
          name: Close
          show_name: false
          styles:
            card:
              - background: rgba(0,0,0,0.6)
              - border-radius: 50%
              - width: 3.5rem
              - height: 3.5rem
              - padding: 0
            icon:
              - color: white
              - width: 2rem
              - height: 2rem
          grid:
            - grid-template-areas: i
            - justify-items: center
            - align-items: center
          tap_action:
            action: call-service
            service: view_assist.set_state
            service_data:
              entity_id: '[[[ return variables.var_assistsat_entity ]]]'
              mode: normal
