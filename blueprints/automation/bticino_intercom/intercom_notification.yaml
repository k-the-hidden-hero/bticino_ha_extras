blueprint:
  name: BTicino Intercom Notification
  description: >
    Sends an urgent push notification when the BTicino doorbell rings.
    Updates the notification with a live snapshot when available.
    Provides three actions: Answer (open live video), Open Door, and Reject.
  domain: automation
  author: k-the-hidden-hero
  source_url: https://github.com/k-the-hidden-hero/bticino_ha_extras/blob/main/blueprints/automation/bticino_intercom/intercom_notification.yaml
  input:
    notify_device:
      name: Mobile device
      description: >
        The mobile device to send the notification to. Pick from the list of
        Home Assistant Companion devices already paired with this HA instance.
      selector:
        device:
          filter:
            - integration: mobile_app
    lock_entity:
      name: Door lock
      description: The lock entity to unlock when "Open Door" is tapped
      selector:
        entity:
          domain: lock
          integration: bticino_intercom
    camera_entity:
      name: Live video camera (optional)
      description: The WebRTC camera entity to open when "Answer" is tapped
      default: ''
      selector:
        entity:
          domain: camera
          integration: bticino_intercom
    snapshot_camera:
      name: Snapshot camera (optional)
      description: >
        The camera entity that holds the snapshot from the incoming call (e.g.
        camera.bticino_intercom_<your_home>_last_event_snapshot). When set, a
        thumbnail is attached to the updated notification. Leave empty to send
        the notification without an image.
      default: ''
      selector:
        entity:
          domain: camera
          integration: bticino_intercom

    # --- Notification behaviour ---
    silent_urgent:
      name: Silent urgent mode
      description: >
        When OFF (default), the notification rings loudly on the alarm
        stream channel and bypasses Do Not Disturb — matches the previous
        blueprint behaviour.

        When ON, the notification still bypasses Do Not Disturb and shows
        on the lock screen, but plays NO sound. Vibration follows the
        pattern below. Useful when the phone is always on silent and the
        user wants the doorbell to buzz, not ring.

        iOS: switches `interruption-level` from `critical` to
        `time-sensitive`. Android: switches the channel from
        `alarm_stream` to a silent high-importance channel
        (`bticino_doorbell_silent`) created on first delivery.
      default: false
      selector:
        boolean:
    vibration_pattern:
      name: Vibration pattern
      description: >
        Comma-separated milliseconds (off, on, off, on, ...). Only used when
        Silent urgent mode is ON. The default mimics an intermittent
        phone-call buzz for ~7 seconds per notification — increase the
        repetitions to extend it. Empty string disables vibration.
      default: '0, 1000, 500, 1000, 500, 1000, 500, 1000'
      selector:
        text:

    # --- Localization (override the defaults to translate the notification) ---
    notification_title:
      name: Notification title
      description: Title shown on the push notification.
      default: 'Doorbell'
      selector:
        text:
    notification_message_default:
      name: Default notification message
      description: >
        Message body when the incoming call event does not provide a name
        (otherwise the event name is used).
      default: 'Someone is at the door'
      selector:
        text:
    answer_label:
      name: 'Answer button label'
      description: Label of the "Answer" action button on the notification.
      default: 'Answer'
      selector:
        text:
    open_door_label:
      name: 'Open door button label'
      description: Label of the "Open door" action button on the notification.
      default: 'Open door'
      selector:
        text:
    reject_label:
      name: 'Reject button label'
      description: Label of the "Reject" action button on the notification.
      default: 'Reject'
      selector:
        text:

mode: single
max_exceeded: silent

variables:
  snapshot_camera_entity: !input snapshot_camera
  notification_title_text: !input notification_title
  notification_message_default_text: !input notification_message_default
  answer_label_text: !input answer_label
  open_door_label_text: !input open_door_label
  reject_label_text: !input reject_label
  silent_urgent_value: !input silent_urgent
  vibration_pattern_value: !input vibration_pattern

trigger:
  - platform: event
    event_type: bticino_intercom_incoming_call
    id: call_event

  - platform: state
    entity_id: !input lock_entity
    to: 'locked'
    id: call_ended

  # Listen for notification actions
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: BTICINO_ANSWER
    id: action_answer

  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: BTICINO_OPEN_DOOR
    id: action_open_door

  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: BTICINO_REJECT
    id: action_reject

action:
  - choose:
      # --- Incoming call: send urgent notification ---
      - conditions:
          - condition: trigger
            id: call_event
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: '{{ notification_title_text }}'
            message: >
              {{ trigger.event.data.name | default(notification_message_default_text) }}
            data:
              tag: bticino_call_active
              channel: "{{ 'bticino_doorbell_silent' if silent_urgent_value else 'alarm_stream' }}"
              importance: high
              push: >-
                {{- {'interruption-level': 'time-sensitive'} if silent_urgent_value
                else {'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}} -}}
              vibrationPattern: "{{ vibration_pattern_value if silent_urgent_value else '' }}"
              actions:
                - action: BTICINO_ANSWER
                  title: '{{ answer_label_text }}'
                - action: BTICINO_OPEN_DOOR
                  title: '{{ open_door_label_text }}'
                - action: BTICINO_REJECT
                  title: '{{ reject_label_text }}'
                  destructive: true

          # Wait briefly for snapshot to arrive, then update notification
          - delay:
              seconds: 3

          # Check if snapshot is available and update notification.
          # Skip silently when no snapshot camera was configured.
          - variables:
              snapshot_url: >
                {% if snapshot_camera_entity %}
                {{- state_attr(snapshot_camera_entity, 'image_url') | default('') -}}
                {% endif %}

          - condition: template
            value_template: "{{ snapshot_url != '' }}"

          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: '{{ notification_title_text }}'
            message: >
              {{ trigger.event.data.name | default(notification_message_default_text) }}
            data:
              tag: bticino_call_active
              image: '{{ snapshot_url }}'
              channel: "{{ 'bticino_doorbell_silent' if silent_urgent_value else 'alarm_stream' }}"
              importance: high
              # No vibration / sound on the update — the initial notification
              # already started ringing. This call only refreshes the image.
              push: >-
                {{- {'interruption-level': 'time-sensitive'} if silent_urgent_value
                else {'interruption-level': 'critical', 'sound': {'name': 'default', 'critical': 1, 'volume': 0.0}} -}}
              actions:
                - action: BTICINO_ANSWER
                  title: '{{ answer_label_text }}'
                - action: BTICINO_OPEN_DOOR
                  title: '{{ open_door_label_text }}'
                - action: BTICINO_REJECT
                  title: '{{ reject_label_text }}'
                  destructive: true

      # --- Answer: open camera ---
      - conditions:
          - condition: trigger
            id: action_answer
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: bticino_call_active

      # --- Open door ---
      - conditions:
          - condition: trigger
            id: action_open_door
        sequence:
          - service: lock.unlock
            target:
              entity_id: !input lock_entity

          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: bticino_call_active

      # --- Reject: dismiss ---
      - conditions:
          - condition: trigger
            id: action_reject
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: bticino_call_active
